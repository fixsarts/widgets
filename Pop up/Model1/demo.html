<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixs.Arts Welcome Widget · Model1 — Demo</title>
<style>
  :root{--bg:#07070b;--pn:#0f0f16;--ln:#23232f;--tx:#f4f4f8;--mu:#9a9aae;--b:#2f7bff;--p:#7c5cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--ln)}
  .brand{font-weight:700;letter-spacing:-.01em;font-size:17px}.brand i{font-style:normal;background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
  header span{color:var(--mu);font-size:13px}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px 24px;align-items:start;max-width:1500px;margin:0 auto}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .bar .sp{flex:1}
  button,select,input,textarea{font:inherit;color:var(--tx)}
  .btn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--p)}.btn.on{background:linear-gradient(135deg,var(--b),var(--p));border-color:transparent}
  .frame{margin:0 auto;width:100%;transition:width .3s;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:#000}
  .frame.m{width:390px}
  #stage{position:relative;height:600px;overflow:hidden;background:var(--sbg,#0b0b10);transition:background .2s}
  .mk{padding:28px;display:grid;gap:12px}.mk i{display:block;height:12px;border-radius:6px;background:var(--sfg,#ffffff1a)}.mk b{display:block;height:120px;border-radius:12px;background:var(--sfg,#ffffff1a)}
  .lb{color:var(--mu);font-size:12.5px}
  #bgc{width:38px;height:34px;padding:2px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;cursor:pointer}
  .ch{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.ch .sp{flex:1}.ch+pre{margin-top:8px}
  pre{margin:12px 0 0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;overflow:auto;max-height:300px;font:12.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
  .note{color:var(--mu);font-size:12.5px;margin:8px 2px 0}
  aside{background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:auto;position:sticky;top:12px;max-height:calc(100vh - 24px);scrollbar-width:thin}
  details{border-bottom:1px solid var(--ln)}details:last-child{border-bottom:0}
  summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
  summary::after{content:"+";color:var(--mu)}details[open] summary::after{content:"–"}
  .fs{padding:0 18px 16px;display:grid;gap:10px}
  .fs h5{margin:6px 0 0;font-size:12px;color:var(--mu);font-weight:600}
  .f{display:grid;gap:4px}.f label{font-size:12.5px;color:var(--mu);display:flex;justify-content:space-between;gap:8px}
  .f label span{color:var(--tx);font-variant-numeric:tabular-nums}
  .f input[type=text],.f textarea,.f select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
  .f textarea{min-height:64px;resize:vertical}
  .f input[type=range]{width:100%;accent-color:var(--p)}
  .f input[type=color]{width:100%;height:32px;padding:2px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;cursor:pointer}
  .ck{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}.ck input{accent-color:var(--p)}
  .row2{display:grid;grid-template-columns:1fr auto;gap:6px}
  :focus-visible{outline:2px solid var(--p);outline-offset:2px}
  @media (max-width:980px){.app{grid-template-columns:1fr}aside{position:static;max-height:none}}
</style>
</head>
<body>
<header><div class="brand">Fixs<i>.Arts</i> Welcome Widget · Model1</div><span>Ubah pengaturan di kanan, hasilnya langsung tampil</span></header>
<div class="app">
  <section>
    <div class="bar">
      <button class="btn on" id="vDesk" type="button">Desktop</button><button class="btn" id="vMob" type="button">Mobile</button>
      <span class="sp"></span>
      <button class="btn" id="bOpen" type="button">Buka modal</button>
      <button class="btn" id="bReset" type="button">Reset Configuration</button>
      <button class="btn" id="bJson" type="button">Export JSON</button>
      <button class="btn" id="bCopy" type="button">Copy installation code</button>
    </div>
    <div class="bar"><span class="lb">Latar contoh website:</span>
      <button class="btn seg on" data-bg="dark" type="button">Hitam</button><button class="btn seg" data-bg="white" type="button">Putih</button><button class="btn seg" data-bg="gray" type="button">Abu</button><button class="btn seg" data-bg="grad" type="button">Gradient</button>
      <input type="color" id="bgc" value="#ffffff" title="Warna latar kustom"></div>
    <div class="frame" id="frame"><div id="stage"><div class="mk"><i style="width:40%"></i><b></b><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i><b></b></div></div></div>
    <p class="note" id="note"></p>
    <div class="ch"><span>Kode instalasi</span><span class="sp"></span><button class="btn" id="bCopyTag" type="button">Salin &lt;script src&gt; saja</button><button class="btn" id="bCopy2" type="button">Salin semua kode</button></div>
    <pre id="code"></pre>
  </section>
  <aside id="panel"></aside>
</div>

<script src="widget.js"></script>
<script>
(function () {
  var W = window.FixsArtsWelcome, CDN = 'https://cdn.jsdelivr.net/gh/fixsarts/widgets@main/Pop%20up/Model1/widget.js';
  var $ = function (s) { return document.querySelector(s); };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function gp(o, p) { return p.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function sp(o, p, v) { var k = p.split('.'), l = k.pop(); k.reduce(function (a, x) { return a[x]; }, o)[l] = v; }
  function isO(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function diff(a, b) {
    var o = {};
    Object.keys(a).forEach(function (k) {
      if (k === 'theme' || typeof a[k] === 'function') return;
      if (isO(a[k]) && isO(b[k])) { var x = diff(a[k], b[k]); if (Object.keys(x).length) o[k] = x; }
      else if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) o[k] = a[k];
    });
    return o;
  }

  var IMG = 'https://cdn.jsdelivr.net/gh/fixsarts/widgets@main/Pop%20up/Model1/assets/images/Card%20for%20Linktree.jpg';
  /* ----- state awal: preset dark + konten contoh ----- */
  function fresh(theme) {
    var s = W.getPreset(theme || 'dark');
    s.title = 'Selamat datang di Fixs.Arts'; s.subtitle = 'Welcome';
    s.description = 'Jelajahi karya dan widget kami. Semua bisa dipasang di website mana pun hanya dengan satu script.';
    s.info = ''; s.container = null;
    s.image.src = IMG; s.image.height = 0;
    s.buttons = [
      { label: 'Mulai', href: '#mulai', color: s.colors.accent, textColor: '#ffffff', variant: 'solid', size: 'md', radius: 12, close: true },
      { label: 'Pelajari lebih lanjut', href: '#info', color: s.colors.accent2, textColor: '#ffffff', variant: 'outline', size: 'md', radius: 12, close: false },
      { label: '', href: '', color: s.colors.accent, textColor: '#ffffff', variant: 'ghost', size: 'md', radius: 12, close: false }
    ];
    return s;
  }
  var state = fresh('dark');

  /* ----- skema kontrol: [path, label, tipe, opsi] ----- */
  var yn = function (p, l) { return [p, l, 'check']; };
  var rg = function (p, l, min, max, step, u) { return [p, l, 'range', { min: min, max: max, step: step || 1, u: u || '' }]; };
  var tc = function (p, l, fb) { return [p, l, 'tcolor', { fb: fb }]; };
  var btn = [yn('show.buttons', 'Tampilkan tombol')];
  [0, 1, 2].forEach(function (i) {
    var b = 'buttons.' + i + '.';
    btn.push(['#', 'Tombol ' + (i + 1) + (i === 2 ? ' (kosongkan label = nonaktif)' : '')],
      [b + 'label', 'Label', 'text'], [b + 'href', 'Link (URL)', 'text'], [b + 'color', 'Warna tombol', 'color'], [b + 'textColor', 'Warna teks', 'color'],
      [b + 'variant', 'Gaya', 'select', ['solid', 'outline', 'ghost', 'gradient']], [b + 'size', 'Ukuran', 'select', ['sm', 'md', 'lg']],
      rg(b + 'radius', 'Radius', 0, 60, 1, 'px'), yn(b + 'close', 'Tutup modal saat diklik'));
  });
  var SCHEMA = [
    ['Preset', true, [['theme', 'Tema bawaan', 'select', W.presets]]],
    ['Konten', true, [['title', 'Judul', 'text'], ['subtitle', 'Subjudul', 'text'], ['description', 'Deskripsi', 'area'], ['info', 'Informasi tambahan', 'area'], ['align', 'Posisi isi', 'select', ['left', 'center', 'right']]]],
    ['Teks (on/off, ukuran, warna)', false, [
      yn('show.subtitle', 'Tampilkan subjudul'), rg('text.subtitle.size', 'Ukuran subjudul', 8, 30, 1, 'px'), tc('text.subtitle.color', 'Warna subjudul', 'colors.accent'), rg('text.subtitle.weight', 'Ketebalan subjudul', 300, 900, 100),
      yn('show.title', 'Tampilkan judul'), rg('text.title.size', 'Ukuran judul', 14, 80, 1, 'px'), tc('text.title.color', 'Warna judul', 'colors.text'), rg('text.title.weight', 'Ketebalan judul', 300, 900, 100),
      yn('show.description', 'Tampilkan paragraf'), rg('text.description.size', 'Ukuran paragraf', 10, 28, 0.5, 'px'), tc('text.description.color', 'Warna paragraf', 'colors.muted'), rg('text.description.weight', 'Ketebalan paragraf', 300, 900, 100),
      yn('show.info', 'Tampilkan info tambahan'), rg('text.info.size', 'Ukuran info', 9, 24, 0.5, 'px'), tc('text.info.color', 'Warna info', 'colors.muted'), rg('text.info.weight', 'Ketebalan info', 300, 900, 100)]],
    ['Gambar banner', true, [yn('show.image', 'Tampilkan gambar'), ['image.src', 'Gambar (URL / upload)', 'src', 'image/*'],
      ['image.order', 'Posisi gambar', 'select', ['top', 'bottom']], yn('image.bleed', 'Penuh sampai tepi modal (jika di atas)'),
      rg('image.width', 'Lebar gambar', 20, 100, 1, '%'), ['image.align', 'Rata gambar', 'select', ['left', 'center', 'right']],
      ['image.height', 'Tinggi (0 = otomatis)', 'range', { min: 0, max: 500, step: 5, u: 'px', z: 1 }],
      rg('image.zoom', 'Zoom', 1, 3, 0.05), rg('image.posX', 'Geser horizontal', 0, 100, 1, '%'), rg('image.posY', 'Geser vertikal', 0, 100, 1, '%'),
      rg('image.radius', 'Radius gambar', 0, 60, 1, 'px'), ['image.fit', 'Fit (jika tinggi diatur)', 'select', ['cover', 'contain']]]],
    ['Tombol', false, btn.concat([['buttonsAlign', 'Posisi tombol', 'select', ['left', 'center', 'right']]])],
    ['Background modal', false, [
      ['backgroundImage.src', 'Background image', 'src', 'image/*'], rg('backgroundImage.dim', 'Gelapkan background', 0, 0.9, 0.05),
      yn('gradient.enabled', 'Gradient background'), ['gradient.from', 'Gradient dari', 'color'], ['gradient.to', 'Gradient ke', 'color'], rg('gradient.angle', 'Sudut gradient', 0, 360, 5, '°')]],
    ['Warna', false, [['colors.background', 'Background', 'color'], ['colors.text', 'Teks', 'color'], ['colors.muted', 'Teks redup', 'color'], ['colors.accent', 'Aksen 1', 'color'], ['colors.accent2', 'Aksen 2', 'color'], ['colors.border', 'Border', 'color'], ['colors.overlay', 'Overlay', 'color']]],
    ['Ukuran & bentuk', false, [rg('size.width', 'Lebar', 260, 900, 10, 'px'), ['size.height', 'Tinggi (0 = otomatis)', 'range', { min: 0, max: 800, step: 10, u: 'px', map: true }],
      ['shape', 'Bentuk', 'select', ['rectangle', 'rounded', 'pill', 'custom']], rg('radius', 'Border radius', 0, 80, 1, 'px'), rg('padding', 'Padding', 8, 80, 1, 'px'), rg('gap', 'Spacing', 0, 40, 1, 'px'), rg('opacity', 'Opacity background', 0.2, 1, 0.05)]],
    ['Efek visual', false, [yn('effects.overlay.enabled', 'Dark overlay'), rg('effects.overlay.opacity', 'Opacity overlay', 0, 1, 0.05),
      yn('effects.blur.enabled', 'Backdrop blur (berat jika web banyak animasi)'), rg('effects.blur.amount', 'Kekuatan blur', 0, 30, 1, 'px'),
      yn('effects.glass.enabled', 'Glassmorphism'), rg('effects.glass.blur', 'Blur glass', 0, 40, 1, 'px'), rg('effects.glass.opacity', 'Opacity glass', 0, 0.6, 0.02),
      ['effects.animation.type', 'Animasi', 'select', ['fade', 'scale', 'slide-up', 'slide-down', 'slide-left', 'none']], rg('effects.animation.duration', 'Durasi animasi', 0, 1500, 50, 'ms'),
      yn('effects.shadow.enabled', 'Shadow'), ['effects.shadow.color', 'Warna shadow', 'color'], rg('effects.shadow.blur', 'Blur shadow', 0, 150, 1, 'px'), rg('effects.shadow.opacity', 'Opacity shadow', 0, 1, 0.05),
      yn('effects.glow.enabled', 'Glow'), ['effects.glow.color', 'Warna glow', 'color'], rg('effects.glow.size', 'Ukuran glow', 0, 150, 1, 'px'),
      yn('effects.border.enabled', 'Border'), rg('effects.border.width', 'Tebal border', 0, 8, 1, 'px'), rg('effects.border.opacity', 'Opacity border', 0, 1, 0.05), ['effects.border.style', 'Gaya border', 'select', ['solid', 'dashed', 'dotted']]]],
    ['Audio', false, [['#', 'Autoplay bersuara diblokir browser sampai pengunjung klik/tap sekali di halaman. Di demo ini terlihat jalan karena Anda sudah berinteraksi. Jika diblokir, audio mulai otomatis pada klik/tap pertama.'], ['audio.src', 'Audio (URL / upload MP3)', 'src', 'audio/*'], yn('audio.autoplay', 'Autoplay saat modal tampil'), rg('audio.volume', 'Volume', 0, 1, 0.05), yn('audio.muted', 'Mute'), yn('audio.loop', 'Loop'), yn('audio.controls', 'Tampilkan kontrol audio')]],
    ['Credit', false, [yn('credit.enabled', 'Tampilkan credit'), ['credit.text', 'Teks', 'text'], ['credit.href', 'Link', 'text'], ['credit.color', 'Warna', 'color'], rg('credit.size', 'Ukuran font', 9, 20, 1, 'px'), ['credit.position', 'Posisi', 'select', ['left', 'center', 'right']]]],
    ['Perilaku', false, [yn('closeButton', 'Tombol close (X)'), yn('closeOnOverlay', 'Tutup saat klik overlay'), yn('closeOnEsc', 'Tutup dengan tombol Esc')]]
  ];

  /* ----- bangun panel ----- */
  var fields = [], panel = $('#panel');
  var KEEP = ['show', 'text', 'title', 'subtitle', 'description', 'info', 'align', 'buttons', 'buttonsAlign', 'image', 'audio', 'closeButton', 'closeOnOverlay', 'closeOnEsc'];
  SCHEMA.forEach(function (sec) {
    var det = document.createElement('details'); det.open = sec[1];
    det.innerHTML = '<summary>' + sec[0] + '</summary>'; var fs = document.createElement('div'); fs.className = 'fs'; det.appendChild(fs); panel.appendChild(det);
    sec[2].forEach(function (f) {
      if (f[0] === '#') { var h = document.createElement('h5'); h.textContent = f[1]; fs.appendChild(h); return; }
      var path = f[0], type = f[2], opt = f[3], wrap = document.createElement('div'), inp, lab = document.createElement('label'), val = document.createElement('span');
      if (type === 'check') {
        wrap.className = 'ck'; wrap.style.cursor = 'pointer'; inp = document.createElement('input'); inp.type = 'checkbox'; var t = document.createElement('span'); t.textContent = f[1]; wrap.append(inp, t);
      } else {
        wrap.className = 'f'; lab.textContent = f[1]; lab.appendChild(val); wrap.appendChild(lab);
        if (type === 'select') { inp = document.createElement('select'); opt.forEach(function (o) { var op = new Option(o, o); inp.add(op); }); }
        else if (type === 'area') { inp = document.createElement('textarea'); }
        else { inp = document.createElement('input'); inp.type = type === 'src' ? 'text' : type === 'tcolor' ? 'color' : type; if (type === 'range') { inp.min = opt.min; inp.max = opt.max; inp.step = opt.step; } }
        if (type === 'src') {
          var r = document.createElement('div'); r.className = 'row2'; inp.placeholder = 'https://… atau upload →';
          var up = document.createElement('input'); up.type = 'file'; up.accept = opt; up.hidden = true;
          var ub = document.createElement('button'); ub.type = 'button'; ub.className = 'btn'; ub.textContent = 'Upload';
          ub.onclick = function () { up.click(); };
          up.onchange = function () {
            var fl = up.files[0]; if (!fl) return;
            if (opt === 'audio/*') { sp(state, path, URL.createObjectURL(fl)); fields.forEach(function (x) { x.paint(); }); render(); }
            else { var rd = new FileReader(); rd.onload = function () { sp(state, path, rd.result); fields.forEach(function (x) { x.paint(); }); render(); }; rd.readAsDataURL(fl); }
          };
          r.append(inp, ub, up); wrap.appendChild(r);
        } else if (type === 'tcolor') {
          var r2 = document.createElement('div'); r2.className = 'row2'; var ab = document.createElement('button'); ab.type = 'button'; ab.className = 'btn'; ab.textContent = 'Ikut tema';
          ab.onclick = function () { sp(state, path, ''); fld.paint(); render(); };
          r2.append(inp, ab); wrap.appendChild(r2);
        } else wrap.appendChild(inp);
      }
      var fld = {
        path: path,
        paint: function () {
          var v = gp(state, path);
          if (type === 'check') inp.checked = !!v;
          else if (type === 'range') { var n = opt.map ? (v === 'auto' ? 0 : v) : v; inp.value = n; val.textContent = ((opt.map || opt.z) && !n ? 'otomatis' : n + opt.u); }
          else if (type === 'tcolor') { inp.value = v || gp(state, opt.fb); val.textContent = v || 'ikut tema'; }
          else inp.value = v == null ? '' : (type === 'src' && /^(data|blob):/.test(v) ? '' : v);
          if (type === 'src' && /^(data|blob):/.test(v || '')) inp.placeholder = '(file lokal terpasang)';
        }
      };
      var ev = (type === 'select' || type === 'check') ? 'change' : 'input';
      inp.addEventListener(ev, function () {
        var v = type === 'check' ? inp.checked : type === 'range' ? parseFloat(inp.value) : inp.value;
        if (type === 'range' && opt.map) v = v === 0 ? 'auto' : v;
        sp(state, path, v);
        if (path === 'theme') { var keep = {}; KEEP.forEach(function (k) { keep[k] = state[k]; }); state = Object.assign(fresh(v), keep); state.theme = v; fields.forEach(function (x) { x.paint(); }); }
        else if (type === 'range') val.textContent = ((opt.map && v === 'auto') || (opt.z && !v)) ? 'otomatis' : v + opt.u;
        else if (type === 'tcolor') val.textContent = v;
        render();
      });
      fs.appendChild(wrap); fields.push(fld);
    });
  });

  /* ----- konfigurasi keluaran ----- */
  function portable(o) {
    ['image', 'backgroundImage', 'audio'].forEach(function (k) {
      if (o[k] && /^(data|blob):/.test(o[k].src || '')) o[k].src = k === 'audio' ? 'URL_AUDIO_ANDA.mp3' : 'URL_GAMBAR_ANDA.jpg';
    });
    return o;
  }
  function usable() { var s = clone(state); s.buttons = s.buttons.filter(function (b) { return (b.label || '').trim(); }); return s; }
  function output() {
    var s = usable(), o = diff(s, W.getPreset(s.theme));
    return portable(Object.assign({ theme: s.theme }, o));
  }
  function code() {
    var j = JSON.stringify(output(), null, 2).replace(/\n/g, '\n  ');
    return '<script src="' + CDN + '"><\/script>\n<script>\n  FixsArtsWelcome.init(' + j + ');\n<\/script>';
  }
  function hasLocal() { return [state.image.src, state.backgroundImage.src, state.audio.src].some(function (v) { return /^(data|blob):/.test(v || ''); }); }

  /* ----- render: preview SELALU dibangun ulang dari state (sinkron) ----- */
  var raf = 0;
  function render() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; doRender(); }); }
  function doRender() {
    var p = usable(); p.container = '#stage'; p.once = false; p.autoOpen = false;
    W.update(p, { replace: true });
    $('#code').textContent = code();
    $('#note').textContent = hasLocal() ? 'Gambar/audio dari upload hanya untuk preview. Di kode & JSON diganti placeholder: upload file ke repo lalu isi URL-nya.' : '';
  }
  function syncAll() { fields.forEach(function (f) { f.paint(); }); render(); }

  var p0 = usable(); p0.container = '#stage'; p0.autoOpen = false; W.init(p0); W.open(); syncAll();

  $('#bOpen').onclick = function () { W.close(); setTimeout(W.open, 60); };
  $('#bReset').onclick = function () { state = fresh('dark'); syncAll(); W.open(); };
  $('#vDesk').onclick = function () { $('#frame').classList.remove('m'); this.classList.add('on'); $('#vMob').classList.remove('on'); };
  $('#vMob').onclick = function () { $('#frame').classList.add('m'); this.classList.add('on'); $('#vDesk').classList.remove('on'); };
  function flash(b, t) { var o = b.textContent; b.textContent = t; setTimeout(function () { b.textContent = o; }, 1500); }
  function copy(text, btn) {
    function ok() { flash(btn, 'Tersalin!'); }
    function fb() {
      var t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
      try { document.execCommand('copy') ? ok() : flash(btn, 'Gagal, salin manual'); } catch (e) { flash(btn, 'Gagal, salin manual'); }
      t.remove();
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
  }
  $('#bCopy').onclick = $('#bCopy2').onclick = function () { copy(code(), this); };
  $('#bCopyTag').onclick = function () { copy('<script src="' + CDN + '"><\/script>', this); };

  /* latar contoh website: untuk memperkirakan tampilan di web terang/gelap */
  var BGS = {
    dark: ['#0b0b10', 'rgba(255,255,255,.1)'], white: ['#ffffff', 'rgba(0,0,0,.08)'], gray: ['#e5e7eb', 'rgba(0,0,0,.08)'],
    grad: ['radial-gradient(circle at 18% 20%,#2f7bff55,transparent 45%),radial-gradient(circle at 82% 75%,#7c5cff55,transparent 45%),#111118', 'rgba(255,255,255,.1)']
  };
  function setBg(bg, fg) { $('#stage').style.setProperty('--sbg', bg); $('#stage').style.setProperty('--sfg', fg); }
  document.querySelectorAll('.seg').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('.seg').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); setBg(BGS[b.dataset.bg][0], BGS[b.dataset.bg][1]); };
  });
  $('#bgc').oninput = function () {
    var h = this.value, l = (parseInt(h.slice(1, 3), 16) * 299 + parseInt(h.slice(3, 5), 16) * 587 + parseInt(h.slice(5, 7), 16) * 114) / 1000;
    document.querySelectorAll('.seg').forEach(function (x) { x.classList.remove('on'); });
    setBg(h, l > 140 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.1)');
  };
  $('#bJson').onclick = function () {
    var a = document.createElement('a'); a.download = 'fixsarts-welcome-config.json';
    a.href = URL.createObjectURL(new Blob([JSON.stringify(output(), null, 2)], { type: 'application/json' }));
    a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
})();
</script>
</body>
</html>
